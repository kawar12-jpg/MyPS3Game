name: Test PS3 Images

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check which image exists
      run: |
        for img in \
          ghcr.io/ps3dev/ps3dev:latest \
          ps3dev/ps3dev:latest \
          ghcr.io/bucanero/ps3dev:latest \
          ghcr.io/ps3dev/psl1ght:latest ; do
          if docker pull "$img" > /dev/null 2>&1; then
            echo "✅ HEYE: $img"
          else
            echo "❌ NINE: $img"
          fi
        done
